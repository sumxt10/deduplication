apiVersion: apps/v1
kind: Deployment
metadata:
  name: ps15-backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: ps15-backend }
  template:
    metadata: { labels: { app: ps15-backend } }
    spec:
      containers:
        - name: backend
          image: ps15-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: ps15-config } }]
          readinessProbe: { httpGet: { path: /health/ready, port: 8000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10 }
