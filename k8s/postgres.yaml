apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ps15-postgres
  labels:
    app: ps15-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ps15-postgres
  template:
    metadata:
      labels:
        app: ps15-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: ps15
            - name: POSTGRES_USER
              value: ps15_admin
            - name: POSTGRES_PASSWORD
              value: ps15_secure_password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ps15-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: ps15-postgres
